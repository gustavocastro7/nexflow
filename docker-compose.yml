services:
  mysql:
    image: mysql:8.0
    container_name: nexflow-mysql-debug
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nexflow_db
      MYSQL_USER: nexflow_user
      MYSQL_PASSWORD: nexflow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_debug_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_debug_data:
